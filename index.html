<!DOCTYPE html>
<html lang="ru" class="dark">
<head>

  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#6d4aff">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          fontFamily: {
            sans: ["Inter", "system-ui", "sans-serif"],
            mono: ["JetBrains Mono", "monospace"],
          },
          colors: {
            cosmos: "#05070f",
          },
          animation: {
            "aurora-slow": "auroraFloat 14s ease-in-out infinite alternate",
            "aurora-reverse": "auroraFloat 18s ease-in-out infinite alternate-reverse",
            "pulse-glow": "pulseGlow 3s ease-in-out infinite",
            "spin-slow": "spin 10s linear infinite",
          },
          keyframes: {
            auroraFloat: {
              "0%": { transform: "translate(0px, 0px) scale(1)" },
              "50%": { transform: "translate(24px, -18px) scale(1.08)" },
              "100%": { transform: "translate(-18px, 14px) scale(0.96)" },
            },
            pulseGlow: {
              "0%, 100%": { opacity: "0.85", transform: "scale(1)" },
              "50%": { opacity: "1", transform: "scale(1.04)" },
            },
          },
        },
      },
    };

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100dvh;
      background-color: #05070f;
      color: #f8fafc;
      font-family: "Inter", system-ui, sans-serif;
      overflow-x: hidden;
    }

    /* Aurora Glassmorphism Surfaces */
    .glass-card {
      background: rgba(13, 18, 34, 0.72);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.09);
      box-shadow: 0 18px 45px -15px rgba(0, 0, 0, 0.75), inset 0 1px 0 rgba(255, 255, 255, 0.07);
    }

    .glass-bubble-ai {
      background: linear-gradient(145deg, rgba(19, 26, 48, 0.88), rgba(12, 16, 31, 0.92));
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.09);
      box-shadow: 0 12px 32px -12px rgba(0, 0, 0, 0.7);
    }

    .glass-bubble-user {
      background: linear-gradient(135deg, #6d28d9 0%, #9333ea 52%, #4f46e5 100%);
      border: 1px solid rgba(255, 255, 255, 0.22);
      box-shadow: 0 10px 28px -8px rgba(124, 58, 237, 0.55);
    }

    /* Custom Scrollbars */
    .chat-scroll::-webkit-scrollbar {
      width: 5px;
    }
    .chat-scroll::-webkit-scrollbar-track {
      background: transparent;
    }
    .chat-scroll::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.22);
      border-radius: 9999px;
    }
    .chat-scroll::-webkit-scrollbar-thumb:hover {
      background: rgba(148, 163, 184, 0.4);
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Timeline Scrubber Styling */
    input[type="range"].cinema-scrubber {
      -webkit-appearance: none;
      appearance: none;
      background: rgba(255, 255, 255, 0.16);
      height: 5px;
      border-radius: 9999px;
      outline: none;
      cursor: pointer;
    }
    input[type="range"].cinema-scrubber::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #e879f9;
      border: 2px solid #ffffff;
      box-shadow: 0 0 10px rgba(232, 121, 249, 0.85);
      cursor: pointer;
    }

    /* Typing Dots Animation */
    .typing-dot {
      animation: typingBounce 1.25s infinite ease-in-out;
    }
    .typing-dot:nth-child(2) {
      animation-delay: 0.18s;
    }
    .typing-dot:nth-child(3) {
      animation-delay: 0.36s;
    }
    @keyframes typingBounce {
      0%, 80%, 100% {
        transform: translateY(0);
        opacity: 0.45;
      }
      40% {
        transform: translateY(-4px);
        opacity: 1;
      }
    }

    /* Markdown Content Styling */
    .md-content p {
      margin-bottom: 0.55rem;
      line-height: 1.58;
    }
    .md-content p:last-child {
      margin-bottom: 0;
    }
    .md-content ul,
    .md-content ol {
      margin: 0.45rem 0 0.65rem 1.25rem;
    }
    .md-content ul {
      list-style-type: disc;
    }
    .md-content ol {
      list-style-type: decimal;
    }
    .md-content li {
      margin-bottom: 0.25rem;
      line-height: 1.52;
    }
    .md-content strong {
      color: #f1f5f9;
      font-weight: 700;
    }
    .md-content code.inline-code {
      font-family: "JetBrains Mono", monospace;
      font-size: 0.82em;
      background: rgba(139, 92, 246, 0.18);
      border: 1px solid rgba(167, 139, 250, 0.28);
      color: #ddd6fe;
      padding: 0.1rem 0.38rem;
      border-radius: 0.4rem;
    }
  </style>
</head>
